# How to turn a row into a scorable complex. From the Materials and Methods
# (L55, L57) of the source.
construct_recipe:
  scaffold_5aei:
    chain: A
    residue_range: [11, 291]        # "residues 11-291 of chain A were taken"
    pocket_positions: [155, 159, 162, 194, 197, 198, 201]
    ligand_chain: D
    ligand_residue_range: [1, 10]
    variable_ligand_position: 4     # "In 5AEI, the respective residue ... is residue 4"
    flanking_alanine_positions: [2, 6]
    flanking_alanine_status: inferred
  scaffold_6sa8:
    chain: A
    residue_range: [179, 514]       # DARPin fusion excluded, per L55
    pocket_positions: [364, 368, 371, 403, 406, 407, 410]
    ligand_chain: B
    ligand_residue_range: [1, 10]
    variable_ligand_position: 6
    flanking_alanine_positions: [4, 8]
    flanking_alanine_status: stated  # "residue 4 and 8 of the ligand were modeled as alanines" (L57)
  base_peptide: KRKRKRKRKR
  inference_note: >
    The paper states the flanking alanines explicitly only in 6SA8 numbering
    (variable position 6, alanines at 4 and 8 — the immediate i±2 neighbours).
    The 5AEI mapping to positions 2 and 6 applies the same i±2 rule around its
    variable position 4 and is an inference, not a quotation. Any Tier A result
    built on the 5AEI scaffold inherits that assumption and must say so.
