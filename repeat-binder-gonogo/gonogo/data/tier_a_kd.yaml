# Tier A per-variant K_D — closes the `status: TODO` in
# bench/repeat-binder-gonogo/cases.yaml.
#
# Extracted verbatim from Table S1 of:
#   Ayyildiz, M., Noske, J., Gisdon, F. J., Kynast, J. P. & Höcker, B.
#   "Evaluation of Physics-Based Protein Design Methods for Predicting Single
#   Residue Effects on Peptide Binding Specificities."
#   J Comput Chem (2025). doi:10.1002/jcc.70160
#   https://paperclip.gxl.ai/citations/papers/PMC12202725#L547-L629
#
# Nothing here is estimated, interpolated, or filled in. Where the paper reports
# no error it is recorded as `null`, not as zero. `-` in the source means the
# measurement was published without an error margin.
#
# READ THIS BEFORE SCORING TIER A
# ------------------------------------------------------------------------
# The ladder varies ONE residue of a 10-mer peptide at ONE pocket position. It
# does not vary repeat count and does not vary peptide length, contrary to the
# rationale given in cases.yaml ("repeat count and peptide length can be varied
# independently"). Whatever scores this tier has to resolve a factor-of-two K_D
# difference caused by a single side chain in a 10-mer. See baselines.yaml for
# the paper's own statement that this is at or below the resolution of large
# structure-prediction models.

source_doc: PMC12202725
source_table: "Table S1"
source_lines: "L547-L629"
units: nM
n_variants: 63
n_pockets: 5

# The 7 scaffold residues that define each pocket, in the order they appear at
# the mutated positions. Verified against the deposited coordinates: chain A
# residues [155, 159, 162, 194, 197, 198, 201] of 5AEI and [364, 368, 371, 403,
# 406, 407, 410] of 6SA8 both read QWSQQEW, which is the Arg-binder pocket, so
# the paper's position lists (L56) map onto the structures as stated.
